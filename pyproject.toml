[tool.poetry]
name = "toolkit"
version = "0.1.0"
description = "Калькулятор и конвертер величин"

[tool.poetry.dependencies]
python = "^3.13"
typer = "^0.27.2"

[tool.poetry.group.dev.dependencies]
pytest = "8.0.0"
ruff = "^0.3.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
src = ["src"]
line-length = 500